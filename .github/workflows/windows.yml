name: Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  worker:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prepare verified worker sources and model
        run: python scripts/setup-zenz.py --prepare-only
      - name: Build Windows AI worker
        run: |
          cmake -S native/zenz -B build/zenz-windows -A x64 -DTGSKK_LLAMA_SOURCE="$pwd/build/llama.cpp-52e53a76df0298d2c316ae7e704eeec03b0bf478"
          cmake --build build/zenz-windows --config Release --parallel 2
      - name: Test real Windows AI scoring and Unicode paths
        run: |
          $env:TGSKK_SERIAL_REFERENCE = "$pwd/build/zenz-windows/Release/test-zenz-serial-reference.exe"
          python native/zenz/tests/check_worker.py build/zenz-windows/Release/tgskk-zenz-worker.exe build/models/zenz-v3.2-small-Q5_K_M.gguf
  desktop:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Test common core
        run: cargo +1.88.0 test --workspace --locked
      - name: Test CSKK with portable keysyms
        run: cargo +1.88.0 test --manifest-path third_party/cskk/Cargo.toml --workspace --features cskk/capi --target-dir target --locked
      - name: Build Windows core
        run: cargo +1.88.0 build --release -p tgskk-ffi --locked
      - name: Build TSF and test harness
        run: |
          cmake -S addons/windows -B build/windows -A x64 -DTGSKK_RUST_LIBRARY="$pwd/target/release/tgskk_ffi.lib"
          cmake --build build/windows --config Release --parallel 2
      - name: Test managed Windows pipes
        shell: pwsh
        run: |
          $env:TGSKK_TEST_CHILD = "$pwd/build/windows/Release/test-windows-child.exe"
          cargo +1.88.0 test -p tgskk-process --test stdio --locked -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.88.0 test -p tgskk-skkserv --test google_windows --locked -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Windows C ABI
        run: ctest --test-dir build/windows -C Release --output-on-failure --no-tests=error
      - name: Test TSF on Windows
        shell: pwsh
        run: |
          $env:TGSKK_DEBUG = '1'
          $text = [System.IO.File]::ReadAllText("$pwd/examples/SKK-JISYO.demo.utf8")
          $text += "`nこう /" + ((1..14 | ForEach-Object { '候補{0:D2}' -f $_ }) -join '/') + "/`n"
          [System.Text.Encoding]::RegisterProvider([System.Text.CodePagesEncodingProvider]::Instance)
          $encoding = [System.Text.Encoding]::GetEncoding(51932)
          [System.IO.File]::WriteAllBytes("$pwd/build/windows/SKK-JISYO.L", $encoding.GetBytes($text))
          & ./build/windows/Release/test-windows-tsf.exe "$pwd/build/windows/Release/tgskk-tip.dll" "$pwd/build/windows/SKK-JISYO.L"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
