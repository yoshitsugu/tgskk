name: Linux packages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [arch, debian-13, ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check release bundling
        run: python3 -m unittest discover -s scripts/tests -p test_prepare_release.py
      - name: Build both frontends, test, install and remove
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 scripts/zenz_model.py --directory build/models
          export TGSKK_TEST_MODEL="$PWD/build/models/zenz-v3.2-small-Q5_K_M.gguf"
          bash scripts/build-package.sh "$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: tgskk-${{ matrix.target }}-x86_64
          path: build/packages/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 14
      - name: Bundle release packages
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: python3 scripts/prepare-release.py --tag "$TAG" --target "$TARGET"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: tgskk-release-${{ matrix.target }}
          path: build/release/*
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: tgskk-release-*
          path: build/release
          merge-multiple: true
      - name: Verify release assets
        working-directory: build/release
        run: |
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 4
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 4
          cat ./*.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" build/release/*.tar.gz build/release/SHA256SUMS \
            --verify-tag --draft --title "$TAG" --notes-file "docs/releases/${TAG#v}.md"
